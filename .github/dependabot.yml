# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Docker ecosystem monitoring
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "commjoen"
    commit-message:
      prefix: "docker"
      include: "scope"
    rebase-strategy: "auto"

  # npm ecosystem monitoring (main package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "commjoen"
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "vite*"
          - "vitest*"
          - "jsdom*"
          - "typescript"
      server-dependencies:
        patterns:
          - "express*"
          - "cors*"
          - "ws*"
          - "node-fetch*"
    commit-message:
      prefix: "deps"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    labels:
      - "dependencies"
    rebase-strategy: "auto"
    # Allow all update types including security
    allow:
      - dependency-type: "all"

  # GitHub Actions monitoring
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "commjoen"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
    rebase-strategy: "auto"
