name: Run Tests
permissions:
  contents: read

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: node server.js &
      - run: npm run test:ci
      - name: Fetch full git history for version injection
        run: git fetch --unshallow || true
